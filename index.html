        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${ACCESS_TOKEN}`
          },
          body: JSON.stringify(ticket)
        });

        // Read the response safely, even if it is not JSON.
        const responseText = await response.text();
        let result = {};

        try {
          result = responseText ? JSON.parse(responseText) : {};
        } catch {
          result = {};
        }

        console.log("HTTP status:", response.status);
        console.log("API response:", responseText);

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}: ${
              result.message ||
              result.error ||
              responseText ||
              "Request failed"
            }`
          );
        }

        const ticketId =
          result.ticket?.id ?? result.id;

        message.textContent = ticketId != null
          ? `Ticket submitted successfully! ID: ${ticketId}`
          : "Ticket submitted successfully!";

        form.reset();

      } catch (error) {
        console.error("Ticket submission error:", error);

        if (error instanceof TypeError) {
          message.textContent =
            "Could not connect to the API. Check the WSO2 gateway, " +
            "HTTPS certificate, and CORS settings.";
        } else {
          message.textContent =
            "Could not submit ticket: " + error.message;
        }
      } finally {
        submitButton.disabled = false;
      }
    });
